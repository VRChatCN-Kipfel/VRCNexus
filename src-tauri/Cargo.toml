[package]
name = "vrcnexus"
version = "0.1.0"
description = "VRCNexus - VRChat automation desktop"
authors = ["lyric"]
edition = "2021"
rust-version = "1.77.2"

[lib]
name = "app_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2.6.3", features = [] }

[dependencies]
tauri = { version = "2.11.3", features = [] }
tauri-plugin-log = "2"
tauri-plugin-shell = "2"
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
log = "0.4"
reqwest = { version = "0.12", default-features = false, features = ["json", "blocking", "rustls-tls"] }
rusqlite = { version = "0.32", features = ["bundled"] }
base64 = "0.22"
urlencoding = "2.1"
dirs = "5.0"
chrono = "0.4"
rand = "0.8"
sha2 = "0.10"
toml = "0.8"
axum = "0.7"
tokio = { version = "1", features = ["rt-multi-thread", "macros", "net", "time", "io-util", "signal"] }
http = "1"

[profile.release]
opt-level = 2
